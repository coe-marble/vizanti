<div id="{uniqueID}_modal" class="modal_outer noselect">
	<div class="modal_inner noselect">
		<h3>Button</h3>
		
		<p id="{uniqueID}_status" class="status">Status: Ok.</p>

		<hr class="dark_hr"/>

		<label for="{uniqueID}_name">Display Text:</label>
		<input id="{uniqueID}_name" type="text" value="Text">

		<div class="spacer"></div>

		<label for="{uniqueID}_action">Behavior:</label>
		<select id="{uniqueID}_action">
			<option value="bool_topic">Toggle Bool topic</option>
			<option value="empty_topic">Publish Empty topic</option>
			<option value="empty_service">Call Empty service</option>
			<option value="trigger_service">Call Trigger service</option>
			<option value="setbool_service">Call SetBool service</option>
		</select>

		<div id="{uniqueID}_endpoint_configuration"></div>

		<hr class="dark_hr"/>

		<p>Choose a behavior, then configure its topic or service endpoint. Toggle Bool topic reflects the value published by the endpoint; SetBool service keeps the successful requested state.</p>

		<p style="color:#b4b4b4;">Click the icon to trigger. Long press to reopen this menu.</p>
		
		<hr class="dark_hr"/>

		<button id="{uniqueID}_remove" class="delete_button" onclick="removeWidget('{uniqueID}')">Remove Widget</button>

	</div>
</div>
