<div id="{uniqueID}_modal" class="modal_outer noselect">

	<div id="{uniqueID}_imgpreview" class="noselect compressedimage_preview">
		<img  src="assets/joypos.svg" alt="Image Preview" width="100" height="100">
	</div> 


	<div class="modal_inner noselect">
		<h3>Compressed Image</h3>
		<p id="{uniqueID}_status" class="status">Status: Ok.</p>
		<hr class="dark_hr"/>

		<div id="{uniqueID}_endpoint_configuration"></div>

		<div class="live_data_display">
			<p id="{uniqueID}_resolution">Resolution: ?</p>
			<p id="{uniqueID}_frame">Frame: ?</p>
			<p id="{uniqueID}_compression">Compression: ?</p>

			<p id="{uniqueID}_datasize" style="color: lightgray;">Data size: ?</p>
			<p id="{uniqueID}_rate" style="color: lightgray;">Rate: ?</p>
			<p id="{uniqueID}_bandwidth" style="color: lightgray;">Bandwidth: ?</p>
			<p id="{uniqueID}_type" style="color: lightgray;">Type: ?</p>

		</div>

		<div class="spacer"></div>

		<label for="{uniqueID}_rotation">Rotation:</label>
		<select id="{uniqueID}_rotation" name="rotation">
			<option value="0">0 degrees</option>
			<option value="90">90 degrees</option>
			<option value="180">180 degrees</option>
			<option value="270">270 degrees</option>
		</select>

		<div class="spacer"></div>

		<label for="{uniqueID}_opacity">Opacity:</label>
		<span id="{uniqueID}_opacity_value">0.85</span>
		<input type="range" value="0.85" step="0.05" min="0.1" max="1.0" id="{uniqueID}_opacity">

		<div class="spacer"></div>

		<label for="{uniqueID}_resize_policy">Resize policy:</label>
		<select id="{uniqueID}_resize_policy">
			<option value="responsive">Responsive width</option>
			<option value="contain">Contain in custom box</option>
			<option value="cover">Cover custom box</option>
			<option value="stretch">Stretch to custom box</option>
		</select>

		<div id="{uniqueID}_responsive_width_controls">
			<div class="spacer"></div>
			<label for="{uniqueID}_width">Width (screen %):</label>
			<span id="{uniqueID}_width_value">25</span>
			<input type="range" value="25" step="1" min="5" max="100" id="{uniqueID}_width">
		</div>

		<div id="{uniqueID}_custom_size_controls" hidden>
			<div class="spacer"></div>
			<label for="{uniqueID}_custom_width">Custom width (px):</label>
			<input type="number" value="400" step="1" min="1" max="4096" id="{uniqueID}_custom_width">

			<div class="spacer"></div>
			<label for="{uniqueID}_custom_height">Custom height (px):</label>
			<input type="number" value="300" step="1" min="1" max="4096" id="{uniqueID}_custom_height">
		</div>

		<div class="spacer"></div>

		<label for="{uniqueID}_throttle">Delivery throttle (ms):</label>
		<input type="number" value="500" step="0" min="0" max="10000" id="{uniqueID}_throttle">

		<div class="spacer"></div>

		<p>High-rate image streams can cause transport congestion. Lower the delivery throttle for faster updates, but other visualizers may stutter.</p>

		<hr class="dark_hr"/>

		<div class="spacer"></div>

		<button id="{uniqueID}_remove" class="delete_button" onclick="removeWidget('{uniqueID}')">Remove Widget</button>

		
	</div>

	<div style="height: 180vh; width: 1px;">
		<!-- Scroll spacer-->
	</div>

</div>
