<style>
	.btmanager-config-modal { max-width: 620px; }
	.btmanager-config-modal h3 { margin-top: 0; }
	.btmanager-config-modal h4 { margin: 0 0 8px; }
	.btmanager-config-status { margin: 0 0 14px; padding: 8px 10px; border: 1px solid rgba(83, 214, 105, 0.55); border-radius: 6px; color: #83df90; background: rgba(35, 96, 47, 0.24); }
	.btmanager-config-status.status-warn { border-color: rgba(255, 205, 42, 0.65); color: #ffcd2a; background: rgba(120, 96, 0, 0.24); }
	.btmanager-config-status.status-error { border-color: rgba(255, 60, 60, 0.7); color: #ff6060; background: rgba(120, 0, 0, 0.24); }
	.btmanager-config-section { padding: 12px; border: 1px solid rgba(160, 160, 160, 0.35); border-radius: 8px; background: rgba(0, 0, 0, 0.12); }
	.btmanager-config-section + .btmanager-config-section { margin-top: 12px; }
	.btmanager-config-section label { display: block; margin-top: 8px; }
	.btmanager-config-section label:first-of-type { margin-top: 0; }
	.btmanager-config-section input { width: 100%; box-sizing: border-box; }
	.btmanager-config-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
	.btmanager-config-actions button { margin: 0; }
	.btmanager-config-modal > .delete_button { margin-top: 16px; }
</style>
<div id="{uniqueID}_modal" class="modal_outer noselect">
	<div class="modal_inner noselect btmanager-config-modal">
		<h3>Behavior Tree Manager</h3>
		<p id="{uniqueID}_status" class="status btmanager-config-status">Everything is OK.</p>

		<section class="btmanager-config-section">
			<h4>Local behavior trees</h4>
			<label for="{uniqueID}_root">Folder</label>
			<input id="{uniqueID}_root" type="text" placeholder="~/.local/share/vizanti/btmanager/behavior_trees">
			<p class="comment">This is the vehicle folder used by the editor.</p>
			<div class="btmanager-config-actions">
				<button id="{uniqueID}_configure">Load XML files</button>
			</div>
		</section>

		<section class="btmanager-config-section">
			<h4>Pull from GitHub</h4>
			<label for="{uniqueID}_github_url">Repository URL</label>
			<input id="{uniqueID}_github_url" type="url" placeholder="https://github.com/owner/repository">
			<label for="{uniqueID}_github_ref">Branch or tag</label>
			<input id="{uniqueID}_github_ref" type="text" value="main" placeholder="main">
			<label for="{uniqueID}_github_subdirectory">Repository subdirectory</label>
			<input id="{uniqueID}_github_subdirectory" type="text" placeholder="behavior_trees">
			<div class="btmanager-config-actions">
				<button id="{uniqueID}_github_pull">Pull XML files</button>
			</div>
		</section>

		<button class="delete_button" onclick="removeWidget('{uniqueID}')">Remove Widget</button>
	</div>
</div>

<div id="{uniqueID}_create_modal" class="modal_outer noselect">
	<div class="modal_inner noselect">
		<h3 id="{uniqueID}_create_title">Create</h3>
		<p id="{uniqueID}_create_status" class="status"></p>
		<hr class="dark_hr"/>

		<label id="{uniqueID}_create_label" for="{uniqueID}_create_input">Name:</label>
		<input id="{uniqueID}_create_input" type="text" autocomplete="off">
		<p id="{uniqueID}_create_hint" class="comment"></p>

		<div class="spacer"></div>
		<button id="{uniqueID}_create_confirm">Create</button>
		<button id="{uniqueID}_create_cancel">Cancel</button>
	</div>
</div>

<div id="{uniqueID}_delete_file_modal" class="modal_outer noselect">
	<div class="modal_inner noselect">
		<h3>Delete Behavior Tree File</h3>
		<p id="{uniqueID}_delete_file_message" class="comment"></p>
		<p>This cannot be undone.</p>
		<div class="spacer"></div>
		<button id="{uniqueID}_delete_file_confirm" class="delete_button">Delete file</button>
		<button id="{uniqueID}_delete_file_cancel">Cancel</button>
	</div>
</div>
